monitor=Virtual-1,1920x1080@60,0x0,1
monitor=,preferred,auto,1

exec-once = swaybg -i /home/chef_carthy/.config/chef-os/wallpapers/chefos-main.png -m fill
exec-once = waybar -c ~/.config/waybar/config-side.jsonc -s ~/.config/waybar/style-side.css
exec-once = quickshell
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgb(A6534A)
    col.inactive_border = rgb(DCD3BE)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(2B2A2833)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    animation = windows, 1, 3, easeOutQuint
    animation = fade, 1, 3, easeOutQuint
    animation = workspaces, 1, 3, easeOutQuint
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# Floating window rules
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = size 640 520, class:^(nwg-look)$
windowrulev2 = center, class:^(nwg-look)$

$mod = SUPER
$term = alacritty
$launcher = rofi -show drun -theme ~/.config/rofi/chefos.rasi
$files = nautilus

bind = $mod, RETURN, exec, $term
bind = $mod, SPACE, exec, $launcher
bind = $mod, E, exec, $files
bind = $mod, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/chefos.rasi | cliphist decode | wl-copy
bind = $mod, W, killactive
bind = $mod, Q, killactive
bind = $mod, L, exec, hyprlock
bind = $mod, PRINT, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png && notify-send "Chef OS" "Screenshot captured"

# Dynamic workspaces 1 to 9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9