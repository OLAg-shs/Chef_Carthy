name: Build Chef_Carthy OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout Chef_Carthy Repository
        uses: actions/checkout@v4

      - name: Initialize Arch Linux & Install archiso
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm archiso git sudo

      - name: Compile Chef_Carthy OS Bootable ISO
        run: |
          mkdir -p /tmp/chef-iso-profile out /tmp/archiso-work
          # Copy base releng bootloader and firmware configs
          cp -r /usr/share/archiso/configs/releng/* /tmp/chef-iso-profile/
          # Overlay Chef_Carthy custom profile, packages, and rootfs
          cp -rf iso/* /tmp/chef-iso-profile/
          mkarchiso -v -w /tmp/archiso-work -o out /tmp/chef-iso-profile/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chef-carthy-os-iso
          path: out/*.iso
          retention-days: 14
