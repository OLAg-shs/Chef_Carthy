# Chef_Carthy OS - Alacritty Terminal Theme (Omarchy-Inspired)

[window]
padding = { x = 14, y = 14 }
opacity = 0.96
blur = false
decorations = "none"

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }

[colors.primary]
background = "#0d1118"
foreground = "#e6edf3"

[colors.cursor]
text = "#0d1118"
cursor = "#58a6ff"

[colors.normal]
black = "#161b22"
red = "#f85149"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#79c0ff"
white = "#e6edf3"

[colors.bright]
black = "#484f58"
red = "#ff7b72"
green = "#56d364"
yellow = "#e3b341"
blue = "#79c0ff"
magenta = "#d2a8ff"
cyan = "#a5d6ff"
white = "#ffffff"
