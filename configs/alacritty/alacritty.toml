# Chef_Carthy OS - Alacritty Terminal Theme

[window]
padding = { x = 12, y = 12 }
opacity = 0.88
blur = true
decorations = "none"

[font]
size = 10.5
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }

[colors.primary]
background = "#0b0e14"
foreground = "#e6edf3"

[colors.cursor]
text = "#0b0e14"
cursor = "#00f0ff"

[colors.normal]
black = "#1f2430"
red = "#ff3333"
green = "#00ff66"
yellow = "#ffb000"
blue = "#00f0ff"
magenta = "#a855f7"
cyan = "#00f0ff"
white = "#e6edf3"

[colors.bright]
black = "#4b5563"
red = "#ff6666"
green = "#33ff88"
yellow = "#ffd166"
blue = "#33f3ff"
magenta = "#c084fc"
cyan = "#67e8f9"
white = "#ffffff"
