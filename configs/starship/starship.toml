# Chef_Carthy OS - Clean Modern Minimalist Shell Prompt
add_newline = false

format = """
$directory$git_branch$git_status$nodejs$rust$golang$python$cmd_duration
$character"""

[directory]
style = "bold #58a6ff"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[character]
success_symbol = "[❯](bold #3fb950) "
error_symbol = "[❯](bold #f85149) "

[git_branch]
symbol = " "
style = "bold #8b949e"

[git_status]
style = "bold #d29922"

[cmd_duration]
min_time = 2_000
style = "bold #8b949e"
format = "[$duration]($style) "
