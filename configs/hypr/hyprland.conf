# ==============================================================================
# Chef_Carthy OS - Hyprland Main Desktop Configuration (Omarchy-Inspired)
# Designed for maximum performance, minimal latency, and aesthetic cyber HUD
# ==============================================================================

# --- Monitors ---
monitor=,preferred,auto,1
monitor=Virtual-1,preferred,auto,1
monitor=Virtual-2,disable
monitor=Virtual-3,disable
monitor=Virtual-4,disable
monitor=Virtual-5,disable
monitor=Virtual-6,disable
monitor=Virtual-7,disable
monitor=Virtual-8,disable

# --- Environment Variables (VMware & Wayland Compatibility) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = AQ_NO_MODIFIERS,1
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland

# --- Autostart Daemons & Cyber HUD ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pipewire & wireplumber & pipewire-pulse
exec-once = waybar
exec-once = swaybg -c "#070a10"
exec-once = mako

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# --- General Appearance (Omarchy-Inspired Clean Theme) ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(58a6ff) rgb(7aa2f7) 45deg
    col.inactive_border = rgb(30363d)
    layout = dwindle
}

# --- Window Decoration & VMware 60FPS Performance ---
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# --- Snappy Fluid Animations ---
animations {
    enabled = true
    bezier = easeOutQuad, 0.25, 1, 0.5, 1

    animation = windows, 1, 2.5, easeOutQuad, popin 90%
    animation = windowsOut, 1, 2, default, popin 90%
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2.5, easeOutQuad, slide
}

# --- Dwindle Layout ---
dwindle {
    preserve_split = true
    force_split = 2
}

# --- Keybindings ---
$mainMod = SUPER

# Launchers & Terminals
bind = $mainMod, Return, exec, alacritty || kitty || foot
bind = $mainMod, T, exec, alacritty || kitty || foot
bind = $mainMod, O, exec, alacritty || kitty || foot
bind = $mainMod, Space, exec, pkill wofi || wofi --show drun
bind = $mainMod, C, exec, alacritty -t 'Chef Control Center' -e chef menu
bind = $mainMod, G, exec, chef-gui
bind = $mainMod, A, exec, alacritty -e chef agent
bind = $mainMod, E, exec, thunar || alacritty -e yazi

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, Escape, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window Cycling & Swapping
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Workspaces Navigation (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Misc & Splash Control ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = true
    focus_on_activate = true
}

