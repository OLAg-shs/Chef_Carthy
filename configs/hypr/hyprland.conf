# ==============================================================================
# Chef_Carthy OS - Hyprland Main Desktop Configuration (Omarchy-Inspired)
# Designed for maximum performance, minimal latency, and aesthetic cyber HUD
# ==============================================================================

# --- Monitors ---
monitor=,preferred,auto,1
monitor=Virtual-1,preferred,auto,1
monitor=Virtual-2,disable
monitor=Virtual-3,disable
monitor=Virtual-4,disable
monitor=Virtual-5,disable
monitor=Virtual-6,disable
monitor=Virtual-7,disable
monitor=Virtual-8,disable

# --- Environment Variables (VMware & Wayland Compatibility) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = AQ_NO_MODIFIERS,1
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland

# --- Autostart Daemons & Cyber HUD ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pipewire & wireplumber & pipewire-pulse
exec-once = waybar
exec-once = swaybg -c "#070a10"
exec-once = mako

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# --- General Appearance ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(00f0ff) rgb(8b5cf6) 45deg
    col.inactive_border = rgb(1f293d)
    layout = dwindle
}

# --- Window Decoration & Cyber Glassmorphism ---
decoration {
    rounding = 8
    active_opacity = 0.96
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000050)
    }
}

# --- Fluid Animations ---
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    animation = windows, 1, 3.5, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3.0, easeInOutCubic, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3.5, easeOutQuint, slide
}

# --- Dwindle Layout ---
dwindle {
    preserve_split = true
    force_split = 2
}

# --- Keybindings ---
$mainMod = SUPER

# Launchers & Terminals
bind = $mainMod, Return, exec, alacritty || kitty || foot
bind = $mainMod, T, exec, alacritty || kitty || foot
bind = $mainMod, Space, exec, pkill wofi || wofi --show drun
bind = $mainMod, C, exec, alacritty -e chef menu
bind = $mainMod, G, exec, chef-gui
bind = $mainMod, A, exec, alacritty -e chef agent
bind = $mainMod, E, exec, thunar || alacritty -e yazi

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces Navigation (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Mouse drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
