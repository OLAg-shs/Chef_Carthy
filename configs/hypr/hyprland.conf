# ==============================================================================
# Chef_Carthy OS - Hyprland Main Configuration
# Designed for maximum performance, minimal latency, and aesthetic cyber HUD
# ==============================================================================

# --- Monitors ---
monitor=,preferred,auto,1

# --- Environment Variables (VMware & Wayland Compatibility) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland

# --- Autostart Daemons ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse
exec-once = alacritty -e chef menu

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# --- General Appearance ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(00f0ff) rgb(7000ff) 45deg
    col.inactive_border = rgb(1f293d)
    layout = dwindle
}

# --- Window Decoration & Performance Tuning ---
decoration {
    rounding = 8
    active_opacity = 0.95
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000040)
    }
}

# --- Fluid Animations ---
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    animation = windows, 1, 3.5, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3.0, easeInOutCubic, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3.5, easeOutQuint, slide
}

# --- Dwindle Layout ---
dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Keybindings ---
$mainMod = SUPER

# Launchers & Terminals
bind = $mainMod, Return, exec, alacritty || foot
bind = $mainMod, Space, exec, wofi --show drun || rofi -show drun
bind = $mainMod, C, exec, alacritty -e chef menu
bind = $mainMod SHIFT, C, exec, alacritty -e chef audit
bind = $mainMod, A, exec, alacritty -e chef ai
bind = $mainMod, N, exec, alacritty -e chef network
bind = $mainMod ALT, V, exec, omarchy-voice toggle

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
