# Chef_Carthy OS - Ultra-Low-Resource & High-Performance Sysctl Tuning
# Ensures minimal RAM consumption, fast responsiveness, and high network throughput

# Keep active processes in RAM, minimizing disk swap overhead
vm.swappiness = 10

# Maintain cached directory & file nodes for instantaneous terminal response
vm.vfs_cache_pressure = 50

# Expand network socket buffer limits for deep traffic inspection & analysis
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Increase maximum file descriptors for forensic and network tools
fs.file-max = 2097152

# Protect system memory from unprivileged allocation attacks
vm.mmap_min_addr = 65536
